<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spearfisher's Notebook</title>
<meta name="theme-color" content="#0C6878">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C6878'/%3E%3Cpath d='M10 33c8-10 26-12 38-2l8-7-2 9 2 9-8-7C36 45 18 43 10 33Z' fill='%23EDF3F2'/%3E%3C/svg%3E">
<script>
/* Paste the two values from Supabase: Project URL (Settings → Data API) and the Publishable key (Settings → API Keys) */
window.NOTEBOOK_CONFIG={
  supabaseUrl:'https://mxerbyvbdednjnvhhjlp.supabase.co',
  supabaseAnonKey:'sb_publishable_2HOShiym_l2vWygC7SKlcA_gTa8k9NE'
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. Add line, search, then the log. Everything else stays folded until asked for. */
:root{
  --bg:#EDF3F2;--surface:#F9FCFB;--ink:#0F2A33;--muted:#4F6B74;--line:#C8D8D8;
  --accent:#C8420C;--on-accent:#FFFFFF;--sea:#0C6878;--sea-soft:#D6E8E9;--mark:#FFD9BF;--danger:#A9231C;--good:#1B7F4B;--amber:#B47A00;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08222B;--surface:#0E2E38;--ink:#E3F0EF;--muted:#94B2B7;--line:#21505B;
  --accent:#FF7A33;--on-accent:#08222B;--sea:#57C4D1;--sea-soft:#14414D;--mark:#7A3A12;--danger:#FF8A80;--good:#5FD39A;--amber:#F4C04E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08222B;--surface:#0E2E38;--ink:#E3F0EF;--muted:#94B2B7;--line:#21505B;
  --accent:#FF7A33;--on-accent:#08222B;--sea:#57C4D1;--sea-soft:#14414D;--mark:#7A3A12;--danger:#FF8A80;--good:#5FD39A;--amber:#F4C04E;color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 clamp(19px,4.5vw,26px)/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
header{display:flex;gap:12px;align-items:center;justify-content:space-between}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:4px 10px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--sea);color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
label,.lbl{display:grid;align-content:start;gap:4px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
button{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:6px;padding:9px 13px;font-weight:500}
button:hover{border-color:var(--sea)}
a{color:var(--sea);text-underline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.primary:hover{border-color:var(--ink)}
.link{border:0;padding:0;background:none;color:var(--sea);text-decoration:underline;text-underline-offset:2px;font-weight:400}

.capture{display:grid;gap:6px;background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:10px 12px}
.capture-row{display:flex;gap:8px;flex-wrap:wrap}
.capture-row input{flex:1 1 170px;border:0;background:transparent;font-size:16px;padding:7px 2px}
.capture-row input:focus-visible{outline:none}
.preview{display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{display:inline-block;font-size:12.5px;background:var(--sea-soft);padding:1px 7px;border-radius:4px;overflow-wrap:anywhere}

.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
#q{font-size:16px}
.more{display:grid;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
.check input{width:auto}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.moods{display:flex;gap:4px;flex:none}
.moods button{padding:5px;line-height:0}
.moods button[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--sea)}
.face{display:block}
.moods button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--sea)}
.lat{font-size:12.5px;color:var(--muted);font-weight:400}
.shot-grid{display:grid;gap:10px}
.shot-app{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:center;color:var(--ink)}
.shot-app b{font-weight:500}
.shot-app button.sa{padding:5px 9px;font-size:13px;font-weight:400}
.compare{margin-top:2px}
.compare>summary{color:var(--sea);font-weight:400;font-size:13.5px}
.cmp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding-top:10px}
@media (max-width:560px){.cmp{grid-template-columns:minmax(0,1fr)}}
.cmp h4{margin:0 0 6px;font-size:13px;font-weight:600}
.cmp-app{display:grid;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.cmp-imgs{display:flex;flex-wrap:wrap;gap:6px}
.cmp-imgs img{max-height:220px;max-width:100%;border-radius:4px;border:1px solid var(--line);display:block}
.cmp ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.fix{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:400}
.mood{align-self:center;line-height:0}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fi{display:inline-block;flex:none;width:50px;height:28px;vertical-align:-9px;margin-right:6px}
.catch-item{display:inline-block;margin-right:12px}
.fishbox{position:relative;min-width:0}
.fishbox .fi{position:absolute;left:6px;top:50%;margin:-14px 0 0;pointer-events:none}
.fishbox input{padding-left:62px}
.fishbox>button{width:100%;text-align:left;background:var(--surface);font-weight:400;padding:9px 10px;display:flex;align-items:center;min-height:42px;overflow:hidden;white-space:nowrap}
.fishbox>button .fi{position:static;margin:0 6px 0 0}
.fishpop{position:absolute;z-index:6;left:0;top:calc(100% + 3px);width:max(100%,300px);max-width:calc(100vw - 48px);max-height:240px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(4,20,26,.22);padding:4px;display:grid}
.fishpop button{border:0;border-radius:4px;display:flex;align-items:center;gap:0;text-align:left;font-weight:400;padding:6px 7px;width:100%;color:var(--ink)}
.fishbox .fishpop .fi{position:static;margin:0 8px 0 0}
.fishpop button:hover,.fishpop button.on{background:var(--sea-soft)}
.fishpop.r{left:auto;right:0}
.cSub>button{width:100%;font-weight:400;padding:9px 6px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:42px;display:block;text-align:center}
.fishpop small{margin-left:auto;color:var(--muted);padding-left:8px}
.windy{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13.5px;color:var(--muted)}
.windy a{padding:2px 9px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.windy a:hover{border-color:var(--sea)}

.linksbox{display:grid;gap:8px;background:var(--sea-soft);border-radius:8px;padding:10px 12px;margin-top:8px}
.linksbox .big{display:flex;flex-wrap:wrap;gap:8px}
.linksbox .big a{flex:none;background:var(--sea);color:var(--bg);font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:6px;text-decoration:none}
.linksbox .big a:hover{opacity:.88}
.hist{display:grid;gap:6px;padding-top:8px;font-size:13.5px}
.hist div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
.hist span{min-width:0;overflow-wrap:anywhere}
.tidecard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.tidecard>summary{font-weight:600;font-size:14px}
.tidecard p{margin:4px 0 0}
.tide-now{font-size:13.5px;margin:8px 0 4px;font-variant-numeric:tabular-nums}
#tideBox{min-height:196px}
#tideBox svg{display:block;overflow:visible}
#tideBox .tg{stroke:var(--line);stroke-width:1}
#tideBox .td{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
#tideBox .tl,#tideBox .tday{fill:var(--muted);font:11px var(--body)}
#tideBox .tday{font-size:11.5px}
#tideBox .ta{fill:var(--sea-soft)}
#tideBox .tc{fill:none;stroke:var(--sea);stroke-width:2}
#tideBox .te{fill:var(--sea)}
#tideBox .tx{fill:var(--ink);font:600 12.5px var(--body);font-variant-numeric:tabular-nums}
#tideBox .th{fill:var(--muted);font:10.5px var(--body)}
#tideBox .tx,#tideBox .th{paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
#tideBox .tn{stroke:var(--accent);stroke-width:1.5}
.fc-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px}
.fc-head select{width:auto;max-width:100%;padding:5px 8px;font-size:13.5px}
#fcBox svg{display:block;overflow:visible;margin-top:4px}
#fcBox .tg{stroke:var(--line);stroke-width:1}
#fcBox .td{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
#fcBox .tn{stroke:var(--accent);stroke-width:1.5}
#fcBox .tl,#fcBox .tday{fill:var(--muted);font:11px var(--body)}
#fcBox .fl{fill:var(--ink);font:600 12px var(--body)}
#fcBox .fk{font:11px var(--body)}#fcBox .kw,#fcBox .kv{fill:var(--sea)}#fcBox .kg,#fcBox .ks{fill:var(--muted)}
#fcBox .fs{fill:var(--ink);font:600 11px var(--body);font-variant-numeric:tabular-nums}
#fcBox .fwind{fill:none;stroke:var(--sea);stroke-width:2}
#fcBox .fgust{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
#fcBox .fwave{fill:none;stroke:var(--sea);stroke-width:2}
#fcBox .farea{fill:var(--sea-soft)}
#fcBox .fswell{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
#fcBox .fa{fill:var(--ink)}#fcBox .fa2{fill:var(--sea)}
#fcBox .fp{fill:var(--sea);opacity:.55}
#fcBox .fw{stroke:var(--ink)}
#tideBox .tnd{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.notice{border:1px dashed var(--line);border-radius:6px;padding:9px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.list{display:grid;border-top:1px solid var(--line)}
.entry{display:grid;gap:4px;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.entry.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--sea-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.entry.fresh{animation:none}}
.head{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.head h3{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 5px}
.acts{margin-left:auto;display:flex;gap:12px;font-size:13.5px}
.catch{overflow-wrap:anywhere}
.catch b{font-weight:600}
.cond{font-size:13px;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.note{white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.photos{display:flex;flex-wrap:wrap;gap:6px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:4px;background:var(--sea-soft);display:block}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{padding:26px 0;display:grid;gap:6px;max-width:58ch}
.empty h2{font:500 16px var(--display);margin:0}
.empty p{margin:0}

dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(4,20,26,.55)}
dialog form{display:grid;gap:13px;padding:16px}
dialog h2{margin:0;font:500 16px var(--display)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:5px 12px;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.catch-row,.catch-head{display:grid;grid-template-columns:minmax(0,1fr) 124px 48px 62px 30px;gap:6px;align-items:center}
@media (max-width:560px){.catch-row,.catch-head{grid-template-columns:minmax(0,1fr) 48px 62px 30px}.catch-head .hsub{display:none}.cSub{grid-column:1/-1;grid-row:2}.cSub:empty{display:none}}
.catch-head{font-size:12px}
.catch-row button{padding:6px;line-height:1}
.hint{font-size:12.5px;font-weight:400;color:var(--muted)}
details>summary{cursor:pointer;font-weight:500;font-size:14px}
details .inner{display:grid;gap:12px;padding-top:12px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;position:sticky;bottom:0;background:var(--surface);padding-block:10px 2px;border-top:1px solid var(--line)}
.foot div{display:flex;gap:8px;margin-left:auto}
.danger{color:var(--danger);border-color:var(--danger)}
.edit-photos{display:flex;flex-wrap:wrap;gap:8px}
.edit-photos div{position:relative}
.edit-photos img{width:72px;height:72px;object-fit:cover;border-radius:4px;display:block}
.edit-photos button{position:absolute;top:2px;right:2px;padding:0 6px;background:var(--surface)}
#viewer{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:rgba(4,14,18,.94);display:none}
#viewer[open]{display:grid;grid-template-rows:minmax(0,1fr) auto;place-items:center}
#viewer::backdrop{background:rgba(4,14,18,.94)}
#vImg{max-width:100%;max-height:100%;object-fit:contain;padding:12px}
.vbar{display:flex;gap:10px;align-items:center;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));color:#fff;font-size:14px}
.vbar button{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:22px;line-height:1;padding:8px 16px;border-radius:8px}
.photos a,.cmp-imgs a{cursor:zoom-in}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:14px;max-width:calc(100vw - 32px);z-index:20}
.acct{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.auth{max-width:420px;margin:8vh auto 0;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.auth h2{margin:0;font:500 17px var(--display)}
.auth p{margin:0;color:var(--muted);font-size:14px}
.auth .err{color:var(--danger);font-size:13.5px}
.auth .tabs{display:flex;gap:6px}
.auth .tabs button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
</style>
</head>
<body>
<div class="wrap" id="authView" hidden>
  <div class="auth">
    <h2>Spearfisher's Notebook</h2>
    <p data-i="authIntro"></p>
    <div class="tabs"><button type="button" id="tabIn" data-i="signIn"></button><button type="button" id="tabUp" data-i="signUp"></button></div>
    <form id="authForm" class="auth" style="margin:0;padding:0;border:0;max-width:none">
      <label for="aEmail"><span>Email</span><input id="aEmail" type="email" autocomplete="email" required></label>
      <label for="aPass"><span data-i="password"></span><input id="aPass" type="password" autocomplete="current-password" minlength="6" required></label>
      <span class="err" id="aErr" hidden></span>
      <button class="primary" type="submit" id="aGo"></button>
    </form>
  </div>
</div>
<div class="wrap" id="appView">
  <header>
    <h1>Spearfisher's Notebook</h1>
    <div class="acct">
      <span id="who" hidden></span><button type="button" class="link" id="signOut" data-i="signOut" hidden></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langEn" lang="en">EN</button>
        <button type="button" id="langPt" lang="pt">PT</button>
      </div>
    </div>
  </header>

  <form class="capture" id="quickForm" autocomplete="off">
    <div class="capture-row">
      <input id="quick" data-ph="quickPh" data-al="quickAl">
      <div class="moods" id="quickMood" role="group" data-al="moodQ"></div>
      <button class="primary" type="submit" data-i="add"></button>
    </div>
    <div class="preview">
      <div class="chips" id="preview"></div>
      <button type="button" class="link" id="quickMore" data-i="details"></button>
    </div>
  </form>

  <div class="notice" id="modeNotice" hidden></div>

  <input id="q" type="search" data-ph="searchPh" data-al="searchPh">
  <div class="bar">
    <select id="fSpot" data-al="spot"></select>
    <div class="fishbox"><select id="fSpecies" hidden></select><button type="button" id="fFishBtn" aria-haspopup="listbox" data-al="fish"></button></div>
    <select id="fMonth" data-al="month"></select>
    <button type="button" id="moreBtn" aria-expanded="false"></button>
  </div>

  <div class="more" id="more" hidden>
    <div class="grid2">
      <label for="fType"><span data-i="type"></span><select id="fType"></select></label>
      <label for="sort"><span data-i="sort"></span><select id="sort"></select></label>
      <label for="fFrom"><span data-i="from"></span><input id="fFrom" type="date"></label>
      <label for="fTo"><span data-i="to"></span><input id="fTo" type="date"></label>
      <label for="fDepthMin"><span data-i="depthMin"></span><input id="fDepthMin" type="number" min="0" inputmode="numeric"></label>
      <label for="fVis"><span data-i="visMin"></span><input id="fVis" type="number" min="0" inputmode="numeric"></label>
      <label for="fTide"><span data-i="tide"></span><select id="fTide"></select></label>
      <label for="fSea"><span data-i="sea"></span><select id="fSea"></select></label>
      <label for="fCurrent"><span data-i="current"></span><select id="fCurrent"></select></label>
      <label for="fDir"><span data-i="dirL"></span><select id="fDir"></select></label>
      <label for="fWeather"><span data-i="weather"></span><select id="fWeather"></select></label>
      <label for="fMood"><span data-i="moodQ"></span><select id="fMood"></select></label>
    </div>
    <label class="check"><input type="checkbox" id="fCaught"> <span data-i="withCatch"></span></label>
    <div class="row">
      <button type="button" class="link" id="clearFilters" data-i="clear"></button>
      <button type="button" class="link" id="showDeleted" data-i="deletedL"></button>
      <button type="button" class="link" id="exportCsv" data-i="csv" hidden></button>
    </div>
    <div class="row">
      <button type="button" class="link" id="backupBtn" data-i="backupL" hidden></button>
      <button type="button" class="link" id="restoreBtn" data-i="restoreL"></button>
      <input type="file" id="restoreInput" accept="application/json,.json" hidden>
    </div>
    <div class="hist" id="delList" hidden></div>
  </div>

  <details class="tidecard" id="tideCard" open>
    <summary><span data-i="tideTitle"></span></summary>
    <div class="tide-now" id="tideNow"></div>
    <div id="tideBox"></div>
    <p class="hint" data-i="tideNote"></p>

  };

    sub(fn,fail){listener=fn;load().catch(fail)},
    newId(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'')},
    async save(id,d){const{error}=await sb.from('entries').upsert({user_id:uid,id,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id,id'});if(error)throw error;await load()},
    async remove(id){const{error}=await sb.from('entries').delete().eq('id',id);if(error)throw error;await load()},
    async backup(id,d,del){const{error}=await sb.from('history').insert({user_id:uid,entry_id:id,saved_at:Date.now(),deleted:!!del,data:d});if(error)throw error},
    async history(){const{data,error}=await sb.from('history').select('entry_id,saved_at,deleted,data').order('saved_at',{ascending:false}).limit(1000);if(error)throw error;return data.map(h=>({entryId:h.entry_id,savedAt:+h.saved_at,deleted:h.deleted,data:h.data}))}
  };
}

function drawForecast(){
  const card=$('fcCard');if(!card||!card.open)return;
  const box=$('fcBox'),now=$('fcNow');
  if(!fcData){now.textContent=t(fcErr||'fcLoading');box.innerHTML='';$('fcStamp').textContent='';return}
  const W=Math.max(300,Math.round(box.clientWidth||600)),days=W<520?2:3,padL=34,padR=10;
  const nowMs=Date.now(),p=lisbonParts(nowMs),mid=nowMs-((p.hour*60+p.minute)*60+p.second)*1000-nowMs%1000,t0=mid,t1=mid+days*864e5;
  const X=t=>padL+(t-t0)/(t1-t0)*(W-padL-padR);
  const rows=(h,keys)=>(h.time||[]).map((s,i)=>{const o={t:s*1000};keys.forEach(k=>o[k]=h[k]?h[k][i]:null);return o}).filter(r=>r.t>=t0-36e5&&r.t<=t1+36e5);
  const wr=rows(fcData.w,['weather_code','cloud_cover','precipitation','visibility','wind_speed_10m','wind_gusts_10m','wind_direction_10m']);
  const mr=rows(fcData.m||{},['wave_height','wave_period','wave_direction','swell_wave_height','swell_wave_period','swell_wave_direction','sea_surface_temperature']);
  const at=(arr,ms)=>arr.reduce((b,r)=>Math.abs(r.t-ms)<Math.abs(b.t-ms)?r:b,arr[0]||{t:0});
  const cw=at(wr,nowMs),cm=at(mr,nowMs);
  const f1=v=>v==null?'—':fmt(Math.round(v*10)/10),f0=v=>v==null?'—':fmt(Math.round(v));
  const sst=mr.map(r=>r.sea_surface_temperature).filter(v=>v!=null);
  now.innerHTML='<b>'+esc(t('tideNowL'))+':</b> '+[
    esc(t('fcWind'))+' '+f0(cw.wind_speed_10m)+' kn ('+esc(t('fcGust'))+' '+f0(cw.wind_gusts_10m)+') '+esc(t('fcFrom'))+' '+(cw.wind_direction_10m!=null?dir16(cw.wind_direction_10m):'—'),
    cm.wave_height!=null?esc(t('fcWaves'))+' '+f1(cm.wave_height)+' m · '+f0(cm.wave_period)+' s '+esc(t('fcFrom'))+' '+dir16(cm.wave_direction):'',
    cm.sea_surface_temperature!=null?esc(t('fcWater'))+' '+f1(cm.sea_surface_temperature)+' °C':'',
    cw.weather_code!=null?esc(t('w_'+wxKind(cw.weather_code))):''].filter(Boolean).join(' · ');
  const fmtD=new Intl.DateTimeFormat(locale(),{timeZone:TZ,weekday:'short',day:'numeric'});
  const grid=(top,bot)=>{let g='';for(let d=0;d<days;d++){const x=X(t0+d*864e5);if(d)g+='<line x1="'+x+'" x2="'+x+'" y1="'+top+'" y2="'+bot+'" class="td"/>'}return g+'<line x1="'+X(nowMs)+'" x2="'+X(nowMs)+'" y1="'+top+'" y2="'+bot+'" class="tn"/>'};
  const step3=r=>{const hh=lisbonParts(r.t).hour;return hh%3===0&&r.t>=t0&&r.t<=t1};
  const step=W<520?6:3,stepOk=r=>{const hh=lisbonParts(r.t).hour;return hh%step===0&&r.t>=t0&&r.t<t1};
  // sky

  const skySvg='<svg viewBox="0 0 '+W+' '+skyH+'" width="100%" height="'+skyH+'">'+grid(18,skyH-6)+sky+'</svg>';
  // wind
  const wH=150,wT=22,wB=38,vmax=Math.max(15,...wr.map(r=>r.wind_gusts_10m||0)),wmax=Math.ceil(vmax/5)*5,WY=v=>wT+(1-v/wmax)*(wH-wT-wB);
  const line=(arr,k,Y)=>arr.filter(r=>r[k]!=null&&r.t>=t0-36e5&&r.t<=t1+36e5).map((r,i)=>(i?'L':'M')+Math.min(Math.max(X(r.t),padL),W-padR).toFixed(1)+' '+Y(r[k]).toFixed(1)).join('');
  let wg='<text x="4" y="14" class="fl">'+esc(t('fcWindT'))+' (kn)</text>';
  for(let v=5;v<wmax;v+=wmax>30?10:5)wg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+WY(v)+'" y2="'+WY(v)+'" class="tg"/><text x="'+(padL-5)+'" y="'+(WY(v)+3.5)+'" text-anchor="end" class="tl">'+v+'</text>';
  wg+=grid(wT,WY(0))+'<path d="'+line(wr,'wind_gusts_10m',WY)+'" class="fgust"/><path d="'+line(wr,'wind_speed_10m',WY)+'" class="fwind"/>';
  wr.filter(stepOk).forEach(r=>{if(r.wind_direction_10m!=null)wg+=arrow(X(r.t),wH-24,r.wind_direction_10m,'fa',1)+'<text x="'+X(r.t)+'" y="'+(wH-6)+'" text-anchor="middle" class="fs">'+f0(r.wind_speed_10m)+'</text>'});
  wg+='<text x="'+(W-padR)+'" y="14" text-anchor="end" class="fk"><tspan class="kw">— '+esc(t('fcWind'))+'</tspan>  <tspan class="kg">- - '+esc(t('fcGust'))+'</tspan></text>';

    const vH=150,vT=22,vB=38,hmax=Math.max(1.5,...mr.map(r=>Math.max(r.wave_height||0,r.swell_wave_height||0))),hm=Math.ceil(hmax*2)/2,VY=v=>vT+(1-v/hm)*(vH-vT-vB);

    const stepv=hm>3?1:.5;for(let v=stepv;v<hm;v+=stepv)vg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+VY(v)+'" y2="'+VY(v)+'" class="tg"/><text x="'+(padL-5)+'" y="'+(VY(v)+3.5)+'" text-anchor="end" class="tl">'+fmt(v)+'</text>';
    const ap=line(mr,'wave_height',VY);
    vg+=(ap?'<path d="'+ap+'L'+Math.min(X(t1+36e5),W-padR)+' '+VY(0)+'L'+padL+' '+VY(0)+'Z" class="farea"/>':'')+grid(vT,VY(0))+'<path d="'+line(mr,'swell_wave_height',VY)+'" class="fswell"/><path d="'+ap+'" class="fwave"/>';
    mr.filter(stepOk).forEach(r=>{if(r.wave_direction!=null)vg+=arrow(X(r.t),vH-24,r.wave_direction,'fa2',1)+'<text x="'+X(r.t)+'" y="'+(vH-6)+'" text-anchor="middle" class="fs">'+f0(r.wave_period)+'s</text>'});

function haystack(e){
  const both=(p,v)=>v?T.en[p+v]+' '+T.pt[p+v]:'';
  const fish=speciesOf(e).map(n=>{const f=fishRow(n);return f?f[0]+' '+f[1]:n}).join(' ');
  const k=kindOf(e);
  return norm([T.en[k==='spot'?'spotT':k],T.pt[k==='spot'?'spotT':k],e.title,e.spot,e.gps,e.notes,e.gear,e.wind,both('cur_',e.current),both('tide_',tidesOf(e)[0]),both('tide_',tidesOf(e)[1]),(e.catches||[]).map(c=>{const v=subsOf(c.name).find(x=>x.id===c.sub);return v?v.pt+' '+v.en+' '+(v.id==='safia'?'mojarra':''):''}).join(' '),both('sea_',e.sea),both('mood_',e.mood),both('w_',e.weather),(e.catches||[]).map(c=>latinOf(c.name,c.sub)).join(' '),e.date,(e.tags||[]).join(' '),fish].join(' '));
}
const terms=()=>norm($('q').value).split(/\s+/).filter(Boolean);
function matches(e){
  const ts=terms();if(ts.length){const h=haystack(e);if(!ts.every(x=>h.includes(x)))return false}
  if($('fType').value&&kindOf(e)!==$('fType').value)return false;
  if($('fSpot').value&&norm(e.spot)!==$('fSpot').value)return false;
  if($('fSpecies').value&&!speciesOf(e).some(n=>fishKey(n)===$('fSpecies').value))return false;
  if($('fMonth').value&&(e.date||'').slice(5,7)!==$('fMonth').value)return false;
  if($('fFrom').value&&!(e.date>=$('fFrom').value))return false;
  if($('fTo').value&&!(e.date<=$('fTo').value))return false;
  const low=(id,val)=>{const lim=num($(id).value);return lim==null||(val!=null&&val>=lim)};
  if(!low('fDepthMin',e.depth)||!low('fVis',e.vis))return false;
  if($('fTide').value&&!tidesOf(e).includes($('fTide').value))return false;
  if($('fSea').value&&e.sea!==$('fSea').value)return false;
  if($('fCurrent').value&&e.current!==$('fCurrent').value)return false;
  if($('fDir').value&&e.currentDir!==$('fDir').value)return false;
  if($('fWeather').value&&e.weather!==$('fWeather').value)return false;
  if($('fMood').value&&e.mood!==$('fMood').value)return false;
  if($('fCaught').checked&&!catchCount(e))return false;
  return true;
}
function sorted(list){
  const v=$('sort').value,d=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0);
  return list.slice().sort(v==='old'?(a,b)=>d(b,a):v==='weight'?(a,b)=>catchKg(b)-catchKg(a)||d(a,b):v==='depth'?(a,b)=>(b.depth||0)-(a.depth||0)||d(a,b):d);
}
function hl(str){
  const out=esc(str),ts=$('q').value.toLowerCase().split(/\s+/).filter(x=>x.length>1).map(esc);
  if(!ts.length)return out;
  return out.replace(new RegExp('('+ts.map(rx).join('|')+')(?![^<]*>)','giu'),'<mark>$1</mark>');
}
function fmtDate(d){if(!d)return'';const[a,b,c]=d.split('-').map(Number);return new Intl.DateTimeFormat(locale(),{day:'numeric',month:'short',year:'numeric'}).format(new Date(a,b-1,c))}

/* Saving */
function clean(o){const r={};Object.keys(o).forEach(k=>{const v=o[k];if(v===''||v==null||(Array.isArray(v)&&!v.length))return;r[k]=v});return r}
const bodyOf=e=>{const{id:_,...d}=e;return d};
/* Saving never drops anything: it merges into the latest copy and keeps the previous version first */
async function saveEntry(id,data){
  if(!store)return false;
  const nid=id||store.newId(),cur=id?entries.find(e=>e.id===id):null,base=cur?bodyOf(cur):{};
  const next={...base};
  Object.keys(data).forEach(k=>{const v=data[k];if(v===''||v==null||(Array.isArray(v)&&!v.length))delete next[k];else next[k]=v});
  try{
    if(cur&&JSON.stringify(base)!==JSON.stringify(next)){await store.backup(id,base)}
    await store.save(nid,next);freshId=nid;render(false);return nid;
  }catch(e){writeError(e);return false}
}

  const id=await saveEntry(null,p);if(!id)return;

    });subW.firstChild.addEventListener('keydown',popKeys)}
    subW.firstChild.textContent=subLabel(inp.value,d.dataset.sub)||t('variety');

let pop=null;
function closePop(){if(pop){pop.el.remove();pop=null}}
function openPop(box,items,onPick,right){
  closePop();if(!items.length)return;
  const el=document.createElement('div');el.className='fishpop'+(right?' r':'');el.setAttribute('role','listbox');
  el.innerHTML=items.map((o,i)=>'<button type="button" role="option" tabindex="-1" data-n="'+i+'">'+(o.icon!=null?o.icon:(o.noIcon?'':fishSvg(o.v)))+'<span>'+esc(o.label)+(o.lat?' <i class="lat">('+esc(o.lat)+')</i>':'')+'</span>'+(o.n?'<small>'+o.n+'</small>':'')+'</button>').join('');
  el.addEventListener('mousedown',e=>e.preventDefault());
  el.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)onPick(items[+b.dataset.n].v)});
  box.appendChild(el);pop={el,items,onPick,box,active:-1};
  const rc=el.getBoundingClientRect(),over=rc.right-(document.documentElement.clientWidth-8);if(over>0)el.style.transform='translateX('+(-Math.min(over,rc.left-8))+'px)';
}
function popKeys(e){
  if(!pop)return;
  if(e.key==='Escape'){e.preventDefault();closePop();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const n=pop.items.length;pop.active=(pop.active+(e.key==='ArrowDown'?1:n-1+(pop.active<0?1:0)))%n;
    [...pop.el.children].forEach((b,i)=>{b.classList.toggle('on',i===pop.active);if(i===pop.active)b.scrollIntoView({block:'nearest'})});
  }else if(e.key==='Enter'&&pop.active>=0){e.preventDefault();pop.onPick(pop.items[pop.active].v)}
}

  const app=shotApp;$('eSave').disabled=true;
  for(const f of files){
    try{const r=await assets.upload(await prepImage(f));form.shots.push({id:r.id,app});drawShots();saveDraft()}
    catch(e){toast(t(e&&e.code==='heic'?'errHeic':e&&e.code==='too_large'?'errLarge':e&&e.code==='unsupported_type'?'errType':'errPhoto'))}
  }
  $('eSave').disabled=false;
});
/* HEIC photos (iPhone) are converted to JPEG in the browser before upload */
let heicLib=null;
function loadHeic(){if(window.heic2any)return Promise.resolve();if(heicLib)return heicLib;heicLib=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=ok;sc.onerror=()=>{heicLib=null;no(new Error('load'))};document.head.append(sc)});return heicLib}
async function prepImage(f){
  if(!(/heic|heif/i.test(f.type)||/\.(heic|heif)$/i.test(f.name||'')))return f;
  try{await loadHeic();const r=await window.heic2any({blob:f,toType:'image/jpeg',quality:.85});const b=Array.isArray(r)?r[0]:r;return new File([b],(f.name||'photo').replace(/\.(heic|heif)$/i,'')+'.jpg',{type:'image/jpeg'})}
  catch(e){throw{code:'heic'}}
}
/* Spelling: asks Claude to fix typos only, and always offers Undo */
let sampler=null,fixPrev=null,fixPending=null;
function fixState(k,canUndo){
  $('fixMsg').textContent=k?t(k):'';$('fixUndo').hidden=!canUndo;
  if(!canUndo)fixPrev=null;
  $('fixBar').hidden=!sampler;
}
async function spellFix(text){
  const out=await sampler('Fix only spelling, accents and obvious typos in the note below. Keep its language or languages, wording, word order, numbers, names and line breaks. Do not translate, rephrase or add anything. Reply with only the corrected text.\n\n<note>\n'+text+'\n</note>',{modelTier:'quick',cache:false});
  const r=String(out&&out.text||'').replace(/<\/?note>/g,'').trim();
  if(!r||r.length>text.length*1.3+8||r.length<text.length*.7)return text;
  return r;
}
function runFix(){
  const el=$('eNotes'),text=el.value.trim();
  if(!sampler||!text){fixPending=null;return}
  fixState('fixing');
  const p=spellFix(text).then(r=>{
    if(el.value.trim()!==text)return;
    if(r===text){fixState('fixNone');return}
    fixPrev=el.value;el.value=r;fixState('fixed',true);
  }).catch(()=>{fixState('fixFail')}).finally(()=>{if(fixPending===p)fixPending=null});
  fixPending=p;
}
$('eNotes').addEventListener('change',runFix);
$('fixBtn').addEventListener('click',runFix);
$('fixUndo').addEventListener('click',()=>{if(fixPrev!=null){$('eNotes').value=fixPrev;fixState(null)}});
function drawPhotos(){$('ePhotos').innerHTML=form.photos.map(p=>'<div><img alt="" src="'+esc(blob(p))+'"><button type="button" aria-label="×" data-rm="'+esc(p)+'">×</button></div>').join('')}
function openForm(e,id){
  const x=e||{};form.id=id||null;form.original=id?x:null;form.photos=(x.photos||[]).slice();form.mood=x.mood||'';form.shots=(x.shots||[]).map(q=>({...q}));confirmDel=false;fixState(null);$('tideHint').hidden=true;
  $('dlgTitle').textContent=t(id?'editEntry':'newEntry');$('eDelete').hidden=!id;$('eHist').hidden=!id;$('eHist').open=false;$('eHistList').innerHTML='';$('eDelete').textContent=t('del');
  const set=(i,v)=>{$(i).value=v==null?'':v};
  set('eDate',x.date||today());set('eSpot',x.spot);set('eGps',x.gps);set('eDepth',x.depth);set('eVis',x.vis);set('eTemp',x.temp);
  set('eIn',x.timeIn);set('eOut',x.timeOut);set('eTideIn',tidesOf(x)[0]);set('eTideOut',tidesOf(x)[1]);set('eCurrent',x.current);set('eDir',x.currentDir);set('eWeather',x.weather);set('eSea',x.sea);set('eWind',x.wind);set('eGear',x.gear);set('eNotes',x.notes);set('eTags',(x.tags||[]).join(', '));
  $('eCatches').innerHTML='';(x.catches&&x.catches.length?x.catches:[null]).forEach(catchRow);
  $('eMore').open=false;setType(e?kindOf(x):'dive');drawPhotos();drawShots();drawMoods();gpsHint();spotHint();$('ePhotoInput').value='';
  $('dlg').showModal();
}
$('eType').addEventListener('click',ev=>{const b=ev.target.closest('[data-t]');if(b)setType(b.dataset.t)});
$('addCatch').addEventListener('click',()=>catchRow().querySelector('input').focus());
$('eCancel').addEventListener('click',()=>$('dlg').close());
$('ePhotos').addEventListener('click',ev=>{const b=ev.target.closest('[data-rm]');if(b){form.photos=form.photos.filter(p=>p!==b.dataset.rm);drawPhotos()}});
$('ePhotoInput').addEventListener('change',async ev=>{
  const files=[...ev.target.files];ev.target.value='';if(!assets||!files.length)return;
  $('eSave').disabled=true;
  for(const f of files){
    try{const r=await assets.upload(await prepImage(f));form.photos.push(r.id);drawPhotos();saveDraft()}
    catch(e){toast(t(e&&e.code==='heic'?'errHeic':e&&e.code==='too_large'?'errLarge':e&&e.code==='unsupported_type'?'errType':'errPhoto'))}
  }
  $('eSave').disabled=false;
});
$('entryForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(document.activeElement===$('eNotes'))$('eNotes').blur();
  await new Promise(r=>setTimeout(r));
  if(fixPending){$('eSave').disabled=true;await Promise.race([fixPending,new Promise(r=>setTimeout(r,8000))]);$('eSave').disabled=false}
  if(form.type!=='dive'&&!$('eSpot').value.trim()&&!$('eNotes').value.trim()){toast(t('needSome'));$('eSpot').focus();return}
  const data=readForm();
  const id=await saveEntry(form.id,data);if(!id)return;
  clearDraft();$('dlg').close();toast(t('saved')+(matches({...data,id})?'':'.'+t('hiddenByF')));
});
function readForm(){
  const v=i=>$(i).value.trim();
  const catches=[...$('eCatches').children].map(r=>({name:r.querySelector('.cName').value.trim(),sub:r.dataset.sub||'',count:num(r.querySelector('.cCount').value)||1,weight:num(r.querySelector('.cWeight').value)})).filter(c=>c.name).map(clean);
  return{type:form.type,mood:form.mood,date:v('eDate')||today(),spot:v('eSpot'),gps:normCoords(v('eGps')),catches,
    depth:num(v('eDepth')),vis:num(v('eVis')),temp:num(v('eTemp')),
    timeIn:v('eIn'),timeOut:v('eOut'),tideIn:v('eTideIn'),tideOut:v('eTideOut'),tide:'',
    current:v('eCurrent'),currentDir:v('eDir'),weather:v('eWeather'),shots:form.shots,sea:v('eSea'),wind:v('eWind'),gear:v('eGear'),
    notes:v('eNotes'),tags:uniq(v('eTags').split(',')),photos:form.photos,createdAt:(form.original&&form.original.createdAt)||Date.now()};
}
/* Unsaved typing survives a page reload */
const DK='sn-draft';let draftTimer=null,draftChecked=false;
function saveDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{if(!$('dlg').open)return;try{localStorage.setItem(DK,JSON.stringify({id:form.id,when:Date.now(),data:readForm()}))}catch(e){}},300)}
function clearDraft(){clearTimeout(draftTimer);try{localStorage.removeItem(DK)}catch(e){}}
function restoreDraft(){
  if(draftChecked)return;draftChecked=true;
  let d=null;try{d=JSON.parse(localStorage.getItem(DK)||'null')}catch(e){}
  if(!d||Date.now()-d.when>864e5*3)return;
  if(d.id&&!entries.some(e=>e.id===d.id))return;
  openForm(d.data,d.id);toast(t('draftBack'));
}
$('entryForm').addEventListener('input',saveDraft);$('entryForm').addEventListener('change',saveDraft);
$('eCancel').addEventListener('click',clearDraft);
/* Previous versions */
const histLine=h=>{const d=h.data||{};return new Date(h.savedAt).toLocaleString(locale(),{dateStyle:'short',timeStyle:'short'})+' · '+[d.spot,(d.catches||[]).map(catchLabel).join(', '),(d.notes||'').slice(0,50)].filter(Boolean).join(' · ')};
async function restoreVersion(h){
  const cur=entries.find(e=>e.id===h.entryId);
  try{if(cur)await store.backup(h.entryId,bodyOf(cur));await store.save(h.entryId,h.data);toast(t('restored'));return true}catch(e){writeError(e);return false}
}
function histRows(el,list,done){
  el.innerHTML=list.map((h,i)=>'<div><span>'+esc(histLine(h))+'</span><button type="button" class="link" data-h="'+i+'">'+esc(t('restore'))+'</button></div>').join('');
  el.onclick=async ev=>{const b=ev.target.closest('[data-h]');if(b&&await restoreVersion(list[+b.dataset.h])&&done)done()};
}
$('eHist').addEventListener('toggle',async()=>{
  if(!$('eHist').open||!store||!form.id)return;
  const id=form.id,el=$('eHistList');el.textContent='…';
  try{const l=(await store.history()).filter(h=>h.entryId===id).sort((a,b)=>b.savedAt-a.savedAt);
    if(l.length)histRows(el,l,()=>{clearDraft();$('dlg').close()});else el.textContent=t('histNone')}catch(e){el.textContent=t('errSave')}
});
$('showDeleted').addEventListener('click',async()=>{
  const el=$('delList');if(!el.hidden){el.hidden=true;return}
  el.hidden=false;el.textContent='…';
  try{const seen=new Set(),l=[];(await store.history()).sort((a,b)=>b.savedAt-a.savedAt).forEach(h=>{if(seen.has(h.entryId)||entries.some(e=>e.id===h.entryId))return;seen.add(h.entryId);l.push(h)});
    if(l.length)histRows(el,l,()=>{el.hidden=true});else el.textContent=t('delNone')}catch(e){el.textContent=t('errSave')}
});
$('eDelete').addEventListener('click',async()=>{
  if(!confirmDel){confirmDel=true;$('eDelete').textContent=t('sure');return}
  const o=form.original||{};
  try{const cur=entries.find(e=>e.id===form.id);if(cur)await store.backup(form.id,bodyOf(cur),true);await store.remove(form.id);clearDraft();$('dlg').close();toast(t('deleted'))}catch(e){writeError(e)}
});
$('list').addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.cmp){d.open?openCmp.add(d.dataset.cmp):openCmp.delete(d.dataset.cmp)}},true);
/* Photo viewer inside the page (opening a photo in a new tab does not work here) */
let vList=[],vI=0;
function vShow(){$('vImg').src=vList[vI];$('vCount').textContent=vList.length>1?(vI+1)+' / '+vList.length:'';$('vPrev').hidden=$('vNext').hidden=vList.length<2}
$('list').addEventListener('click',ev=>{
  const a=ev.target.closest('.photos a,.cmp-imgs a');if(!a)return;
  ev.preventDefault();const g=a.closest('.photos,.cmp-imgs');
  vList=[...g.querySelectorAll('img')].map(i=>i.currentSrc||i.src);vI=[...g.querySelectorAll('a')].indexOf(a);vShow();$('viewer').showModal();
},true);
$('vPrev').addEventListener('click',()=>{vI=(vI+vList.length-1)%vList.length;vShow()});
$('vNext').addEventListener('click',()=>{vI=(vI+1)%vList.length;vShow()});
$('vClose').addEventListener('click',()=>$('viewer').close());
$('viewer').addEventListener('click',ev=>{if(ev.target===$('viewer')||ev.target===$('vImg'))$('viewer').close()});
$('viewer').addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft')$('vPrev').click();if(ev.key==='ArrowRight')$('vNext').click()});
$('ePhotos').addEventListener('click',ev=>{const im=ev.target.closest('img');if(!im)return;vList=[...$('ePhotos').querySelectorAll('img')].map(i=>i.src);vI=vList.indexOf(im.src);vShow();$('viewer').showModal()});
$('list').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-edit]');if(!b)return;
  const e=entries.find(x=>x.id===b.dataset.edit);if(e)openForm(e,e.id);
});

/* Filter controls */
['q','fSpot','fSpecies','fMonth','fType','fFrom','fTo','fDepthMin','fVis','fTide','fSea','fCurrent','fDir','fWeather','fMood','fCaught','sort'].forEach(i=>{$(i).addEventListener('input',()=>render(false))});
$('clearFilters').addEventListener('click',()=>{
  ['q','fSpot','fSpecies','fMonth','fType','fFrom','fTo','fDepthMin','fVis','fTide','fSea','fCurrent','fDir','fWeather','fMood'].forEach(i=>{$(i).value=''});
  $('fCaught').checked=false;render(false);
});
$('clearExamples').addEventListener('click',async()=>{
  if(!confirmEx){confirmEx=true;$('clearExamples').textContent=t('sureEx');return}
  try{for(const e of entries.filter(x=>x.example)){await store.backup(e.id,bodyOf(e),true);await store.remove(e.id)}toast(t('exDeleted'))}catch(e){writeError(e)}
  confirmEx=false;$('clearExamples').textContent=t('clearEx');
});
$('backupBtn').addEventListener('click',async()=>{
  let history=[];try{history=store?await store.history():[]}catch(e){}
  const files={};
  if(assets&&assets.download){for(const e of entries)for(const id of(e.photos||[]).concat((e.shots||[]).map(x=>x.id))){if(files[id])continue;try{const b=await assets.download(id);files[id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch(err){}}}
  const data=JSON.stringify({app:'spearfishers-notebook',version:2,savedAt:new Date().toISOString(),entries:entries.map(e=>({id:e.id,...bodyOf(e)})),history,files},null,1);
  try{await downloads.save({filename:'spearfishers-notebook-'+today()+'.json',data});toast(t('fileSaved'))}
  catch(e){if(!e||e.code!=='declined')toast(t('errFile'))}
});
$('restoreBtn').addEventListener('click',()=>$('restoreInput').click());
$('restoreInput').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f||!store)return;
  let j;try{j=JSON.parse(await f.text())}catch(e){toast(t('errImport'));return}
  if(!j||j.app!=='spearfishers-notebook'||!Array.isArray(j.entries)){toast(t('errImport'));return}
  const map={};
  if(j.files&&assets)for(const[old,url]of Object.entries(j.files)){try{const b=await(await fetch(url)).blob();map[old]=(await assets.upload(new File([b],'p',{type:b.type}))).id}catch(err){}}
  const remap=e=>({...e,photos:(e.photos||[]).map(p=>map[p]||p),shots:(e.shots||[]).map(x=>({...x,id:map[x.id]||x.id}))});
  let n=0;
  for(const e0 of j.entries){const e=remap(e0);
    if(!e||typeof e.id!=='string'||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(e.id))continue;
    const{id,...d}=e;
    if(entries.some(x=>x.id===id)){if(await saveEntry(id,d))n++}
    else{try{await store.save(id,d);n++}catch(err){writeError(err);break}}
  }
  toast(t('importedN')(n));
});
$('exportCsv').addEventListener('click',async()=>{
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=[t('date'),t('type'),t('spot'),t('coords'),t('fish'),t('qty'),t('kg'),t('depth'),t('vis'),t('temp'),t('timeIn'),t('timeOut'),t('tideIn'),t('tideOut'),t('current'),t('dirL'),t('weather'),t('sea'),t('moodQ'),t('wind'),t('gear'),t('tags'),t('notes')];
  const rows=sorted(entries.filter(matches)).map(e=>[e.date,typeLabel(kindOf(e)),e.spot||e.title,e.gps,(e.catches||[]).map(c=>catchLabel(c)+(latinOf(c.name,c.sub)?' ('+latinOf(c.name,c.sub)+')':'')).join('; '),catchCount(e)||'',catchKg(e)||'',e.depth,e.vis,e.temp,e.timeIn,e.timeOut,tidesOf(e)[0]?t('tide_'+tidesOf(e)[0]):'',tidesOf(e)[1]?t('tide_'+tidesOf(e)[1]):'',e.current?t('cur_'+e.current):'',dirLabel(e.currentDir),e.weather?t('w_'+e.weather):'',e.sea?t('sea_'+e.sea):'',e.mood?t('mood_'+e.mood):'',e.wind,e.gear,(e.tags||[]).join('; '),e.notes].map(q).join(','));
  try{await downloads.save({filename:'spearfishers-notebook.csv',data:'﻿'+[head.map(q).join(',')].concat(rows).join('\r\n')});toast(t('fileSaved'))}
  catch(e){if(!e||e.code!=='declined')toast(t('errFile'))}
});

boot();
})();
